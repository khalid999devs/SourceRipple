server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 20
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: sourceripple
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      # The spring_session tables do not exist yet, so the expiry cleanup job stays off.
      cleanup-cron: "-"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: SourceRipple
  git:
    commit: ${GIT_COMMIT:${RENDER_GIT_COMMIT:unknown}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sourceripple:
  public-base-url: ${SOURCERIPPLE_PUBLIC_BASE_URL:http://localhost:8080}
  encryption-key: ${SOURCERIPPLE_ENCRYPTION_KEY:}
  tick-token: ${SOURCERIPPLE_TICK_TOKEN:}
  admin:
    email: ${SOURCERIPPLE_ADMIN_EMAIL:}
    password: ${SOURCERIPPLE_ADMIN_PASSWORD:}
  metrics:
    username: ${SOURCERIPPLE_METRICS_USERNAME:}
    password: ${SOURCERIPPLE_METRICS_PASSWORD:}
  scheduler:
    mode: ${SOURCERIPPLE_SCHEDULER_MODE:internal}
    loop-interval: 60s
    tick-budget: 60s
    claim-batch: 10
    lease: 5m
  watches:
    default-interval-hours: 24
    min-interval-hours: ${SOURCERIPPLE_MIN_INTERVAL_HOURS:6}
    versions-retained: 10
    max-per-project: 20
    max-per-organization: 100
    max-organizations-per-user: 5
    max-active-sources: 200
  fetch:
    allow-private-targets: ${SOURCERIPPLE_FETCH_ALLOW_PRIVATE_TARGETS:false}
    connect-timeout: 5s
    read-timeout: 10s
    total-timeout: 15s
    max-compressed-bytes: 2MB
    max-decoded-bytes: 5MB
    max-redirects: 3
    concurrency: 2
    per-host-gap: 10s
    allowed-ports: [80, 443, 8080, 8443]
  webhooks:
    timeout: 5s
    max-attempts: 6
  demo:
    enabled: ${SOURCERIPPLE_DEMO_ENABLED:false}
    webhook-secret: ${SOURCERIPPLE_DEMO_WEBHOOK_SECRET:}
    user-password: ${SOURCERIPPLE_DEMO_USER_PASSWORD:}
