sourceripple:
  public-base-url: http://localhost
  scheduler:
    mode: external
  watches:
    min-interval-hours: 1
  fetch:
    allow-private-targets: true
    allowed-ports: [80, 443, 8080, 8443, 18089]
  demo:
    enabled: false

logging:
  level:
    io.sourceripple: DEBUG
    org.testcontainers: INFO
