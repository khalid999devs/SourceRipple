name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          def totals(pattern):
              t = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for path in glob.glob(pattern):
                  root = ET.parse(path).getroot()
                  for key in t:
                      t[key] += int(float(root.get(key, 0)))
              return t

          print("### Backend tests\n")
          print("| Suite | Tests | Failures | Errors | Skipped |")
          print("|---|---|---|---|---|")
          for name, pattern in (("Unit (Surefire)", "target/surefire-reports/TEST-*.xml"),
                                ("Integration (Failsafe)", "target/failsafe-reports/TEST-*.xml")):
              t = totals(pattern)
              print(f"| {name} | {t['tests']} | {t['failures']} | {t['errors']} | {t['skipped']} |")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            backend/target/site/jacoco-it/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    name: docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag sourceripple:ci .

      - name: Create CI .env
        run: |
          cp .env.example .env
          for var in SOURCERIPPLE_ADMIN_PASSWORD SOURCERIPPLE_METRICS_PASSWORD SOURCERIPPLE_TICK_TOKEN \
                     SOURCERIPPLE_DEMO_WEBHOOK_SECRET SOURCERIPPLE_DEMO_USER_PASSWORD \
                     POSTGRES_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            sed -i "s|^${var}=.*|${var}=${value}|" .env
          done
          key="$(openssl rand -base64 32)"
          echo "::add-mask::$key"
          sed -i "s|^SOURCERIPPLE_ENCRYPTION_KEY=.*|SOURCERIPPLE_ENCRYPTION_KEY=${key}|" .env
          sed -i "s|^GIT_COMMIT=.*|GIT_COMMIT=${GITHUB_SHA}|" .env

      - name: Start the Compose stack
        run: docker compose up -d --build

      - name: Wait for /actuator/health = UP
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "The app did not become healthy in time." >&2
          exit 1

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root"></div>'
          curl -fsS http://localhost:8080/pricing | grep -q '<div id="root"></div>'
          curl -fsS http://localhost:8080/actuator/info | grep -q "${GITHUB_SHA}"
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/prometheus)"
          test "$status" = "401"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop the Compose stack
        if: always()
        run: docker compose down -v

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

